name: "KalaScan"

description: "Scan a repository or IDE package for malware and upload SARIF results to GitHub Code Scanning"

inputs:
  target:
    description: "Repository URL, marketplace URL, or local package path to scan"
    required: true
  fail_on_risk:
    description: "Exit non-zero when the risk score is at or above this threshold (0-100)"
    required: false
    default: "60"
  yara_dir:
    description: "Directory of custom YARA rules"
    required: false
  changed_only:
    description: "Scan only files changed against base_ref (fast PR scans)"
    required: false
    default: "false"
  base_ref:
    description: "Git ref used as the diff base for changed_only and new_dependencies"
    required: false
    default: "origin/main"
  new_dependencies:
    description: "Also scan every package the lockfiles add or change against base_ref (needs base_ref fetched, e.g. actions/checkout with fetch-depth: 0). Fails at fail_on_risk"
    required: false
    default: "false"
  untrusted:
    description: "Scan the target as someone else's code: no skipped build dirs, no inline kalascan:ignore markers, no .kalascanignore or kalascan.toml from the checkout. Keep \"true\" for pull requests, whose author controls those files"
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install KalaScan
      # Build the same revision as the action ref, not a hard-coded tag.
      run: |
        set -euo pipefail
        if ! command -v kalascan >/dev/null 2>&1; then
          cargo install --locked --path "$GITHUB_ACTION_PATH"
        fi
      shell: bash

    - name: Scan target
      env:
        TARGET: ${{ inputs.target }}
        FAIL_ON_RISK: ${{ inputs.fail_on_risk }}
        YARA_DIR: ${{ inputs.yara_dir }}
        CHANGED_ONLY: ${{ inputs.changed_only }}
        BASE_REF: ${{ inputs.base_ref }}
        UNTRUSTED: ${{ inputs.untrusted }}
      run: |
        set -euo pipefail
        args=(scan "$TARGET" --format sarif --output kalascan.sarif --fail-on-risk "$FAIL_ON_RISK")
        if [ -n "$YARA_DIR" ]; then args+=(--yara-dir "$YARA_DIR"); fi
        if [ "$UNTRUSTED" != "false" ]; then args+=(--untrusted); fi
        if [ "$CHANGED_ONLY" = "true" ]; then args+=(--changed-only --base-ref "$BASE_REF"); fi
        kalascan "${args[@]}"
      shell: bash

    - name: Scan new dependencies
      # A pull request's way in is a new package in the lockfile, not a line of
      # the repository's own code. Development dependencies install in CI too.
      if: inputs.new_dependencies == 'true'
      env:
        FAIL_ON_RISK: ${{ inputs.fail_on_risk }}
        BASE_REF: ${{ inputs.base_ref }}
      run: kalascan deps . --base-ref "$BASE_REF" --include-dev --fail-on-risk "$FAIL_ON_RISK"
      shell: bash

    - name: Upload SARIF
      # Upload even when the risk gate failed the scan step, so the findings show.
      if: always() && hashFiles('kalascan.sarif') != ''
      uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        sarif_file: kalascan.sarif

branding:
  icon: shield
  color: purple
