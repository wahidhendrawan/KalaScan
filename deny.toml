# cargo-deny policy, run by the cargo-deny job in .github/workflows/ci.yml and
# locally with `cargo deny check` (cargo install cargo-deny --locked).

[advisories]
# RustSec vulnerabilities and unsound crates fail the check; yanked crates too.
# Unmaintained crates only fail for direct dependencies: bincode 2 is pulled in
# by yara-x and has no replacement there.
yanked = "deny"
unmaintained = "workspace"
ignore = [
    # rsa Marvin timing attack: transitive via yara-x (authenticode signature
    # checks, never attacker-timed decryption); no fixed release exists.
    { id = "RUSTSEC-2023-0071", reason = "transitive via yara-x, no fixed version" },
]

[licenses]
# Anything outside this list fails. GPL-3.0 is KalaScan's own licence.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "0BSD",
    "Unlicense",
    "GPL-3.0-only",
    "CDLA-Permissive-2.0",  # webpki-roots
    "bzip2-1.0.6",          # libbz2-rs-sys
]
confidence-threshold = 0.8

[bans]
# 18 crates are pulled in twice today (sha2 0.10/0.11, thiserror 1/2, rustix 0.38/1, ...);
# warn so the list stays visible without blocking CI.
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
