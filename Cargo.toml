[package]
name = "kalascan"
version = "1.0.0"
edition = "2021"
description = "Local Git Repository Security & Malware Scanner — detects malware indicators using static RegEx rules and AI deep analysis."
authors = ["Wahid Hendrawan"]
license = "GPL-3.0"
repository = "https://github.com/wahidhendrawan/KalaScan"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
regex = "1"
walkdir = "2"
tempfile = "3"
tera = "1"
uuid = { version = "1", features = ["v4"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
anyhow = "1"
zip = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.31", features = ["bundled"] }
