[package]
name = "kalascan"
version = "1.6.0"
edition = "2021"
description = "Security & Malware Scanner for Git Repositories and IDE Extensions (VS Code, Open VSX, JetBrains, Browser CRX) using RegEx, YARA, Entropy, deep static binary triage, recursive deobfuscation, safe static emulation, TTP/ATT&CK coverage, opt-in Docker sandboxing, and AI deep analysis."
authors = ["Wahid Hendrawan"]
license = "GPL-3.0"
repository = "https://github.com/wahidhendrawan/KalaScan"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
regex = "1"
walkdir = "2"
tempfile = "3"
tera = "1"
uuid = { version = "1", features = ["v4"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
anyhow = "1"
zip = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.31", features = ["bundled"] }
clap = { version = "4", features = ["derive", "env"] }
yara-x = "1.22.0"
goblin = "0.10.7"
sha2 = "0.11.1"
hex = "0.4.3"
base64 = "0.23.1"
flate2 = "1.1.10"
iced-x86 = "1.21.0"
