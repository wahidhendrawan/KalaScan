openapi: 3.0.3
info:
  title: KalaScan API
  description: |
    Local Git repository & IDE extension security and malware scanner.
    Async scan API: submit, then poll the status endpoint until `done`.
  # Filled in with the binary's version when served at /openapi.yaml.
  version: __VERSION__
servers:
  - url: http://127.0.0.1:3000
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      summary: Liveness/readiness probe (no auth)
      security: []
      responses:
        "200":
          description: Service is up
  /metrics:
    get:
      summary: Prometheus metrics (no auth)
      security: []
      responses:
        "200":
          description: text/plain Prometheus exposition
  /openapi.yaml:
    get:
      summary: This specification (no auth)
      security: []
      responses:
        "200":
          description: The OpenAPI document
  /scan:
    post:
      summary: Alias of POST /api/scan (the dashboard uses it); same body, responses and auth
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScanRequest" }
      responses:
        "200":
          description: Accepted; poll the status endpoint
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanAccepted" }
  /api/scan:
    post:
      summary: Submit a scan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScanRequest" }
      responses:
        "200":
          description: Accepted; poll the status endpoint
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanAccepted" }
        "400": { description: "Local path target, or a CLI-only field (yara_dir, rules_file, ignore, baseline, sandbox_image, sandbox_runtime)" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/scan/upload:
    post:
      summary: Submit a scan from an uploaded package (.vsix/.zip/.jar/.crx)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
                llm_provider: { type: string, default: ollama }
                llm_model: { type: string, default: llama3 }
                llm_api_key: { type: string, description: "Never persisted with queued scans" }
                llm_endpoint: { type: string }
                ai_analysis_enabled: { type: boolean }
                check_cve: { type: boolean, default: true }
                deep_triage: { type: boolean }
                deobfuscate: { type: boolean }
                emulate: { type: boolean }
                sandbox: { type: boolean }
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanAccepted" }
        "400": { description: "No file in the form, or the upload could not be unpacked" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/scan/{id}/status:
    get:
      summary: Poll scan progress
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Scan status; `result` is present once `done` is true
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanStatus" }
        "404": { description: Not found }
  /api/scan/{id}:
    delete:
      summary: Cancel a queued or running scan, or delete a finished one from the history
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Deleted or cancelled }
        "404": { description: Not found }
  /api/results/{id}:
    get:
      summary: Full scan result
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  result: { $ref: "#/components/schemas/ScanResult" }
        "404": { description: Not found }
  /api/history:
    get:
      summary: Recent scan summaries
      responses:
        "200":
          description: Scan list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  scans:
                    type: array
                    items: { $ref: "#/components/schemas/ScanSummary" }
  /api/report/{id}/{format}:
    get:
      summary: Export a scan in another format
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - name: format
          in: path
          required: true
          schema: { type: string, enum: [md, html, sarif, csv, junit, github, stix, osv] }
      responses:
        "200": { description: Report body }
        "400": { description: Unknown format }
        "404": { description: Not found }
        "422": { description: "The scan cannot be written as `osv` (not an npm / PyPI package with an exact version, or below the danger level)" }
  /api/sbom:
    get:
      summary: CycloneDX 1.5 SBOM for a directory under the server working dir
      parameters:
        - name: path
          in: query
          required: false
          schema: { type: string }
          description: Absolute path; defaults to the server working directory
      responses:
        "200":
          description: CycloneDX document
          content:
            application/vnd.cyclonedx+json:
              schema: { type: object }
        "400": { description: Path does not exist }
        "403": { description: Path is outside the allowed root }
        "401": { description: Missing or invalid bearer token }
  /api/audit:
    get:
      summary: Append-only audit log (admin only), newest 200 entries plus newest 200 denied requests
      responses:
        "200":
          description: Audit entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        timestamp: { type: string }
                        actor: { type: string }
                        action: { type: string }
                        target: { type: string, nullable: true }
                        detail: { type: string, nullable: true }
        "403": { description: Admin role required }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        `Authorization: Bearer <token>`. Tokens are created with
        `kalascan user add`. The legacy `KALASCAN_TOKEN` env var also works.
  responses:
    Unauthorized:
      description: Missing or invalid token
    Forbidden:
      description: Role too low for this action
    RateLimited:
      description: Scan queue full (64 queued or running), or submission budget exhausted (KALASCAN_SCAN_RATE_LIMIT)
  schemas:
    ScanRequest:
      type: object
      required: [repo_url]
      properties:
        repo_url: { type: string, description: "Git URL (https/ssh), marketplace URL, publisher.extension[@version], npm:name[@version], crates:name[@version] or pypi:name[==version]. Local paths are CLI-only; upload packages via /api/scan/upload" }
        llm_provider: { type: string, enum: [ollama, openai, deepseek, 9router, custom], description: "No default here: needed with ai_analysis_enabled" }
        llm_model: { type: string, description: "Needed with ai_analysis_enabled" }
        llm_api_key: { type: string, description: "Never persisted with queued scans" }
        llm_endpoint: { type: string }
        ai_analysis_enabled: { type: boolean }
        check_cve: { type: boolean }
        yara_dir: { type: string, description: "CLI-only; rejected by the API" }
        rules_file: { type: string, description: "CLI-only; rejected by the API" }
        git_history: { type: boolean }
        history_max_commits: { type: integer, description: "With git_history: the newest commits walked" }
        history_since: { type: string, description: "With git_history: only commits after this date (any `git log --since` date)" }
        deep_triage: { type: boolean }
        deobfuscate: { type: boolean }
        emulate: { type: boolean }
        sandbox: { type: boolean }
        sandbox_image: { type: string, description: "CLI-only; rejected by the API" }
        sandbox_runtime: { type: string, description: "CLI-only; rejected by the API" }
        secrets: { type: boolean, description: "Also report hard-coded credentials (gitleaks patterns, medium severity)" }
        new_only: { type: boolean }
        baseline: { type: string, description: "CLI-only; rejected by the API" }
        ignore: { type: string, description: "CLI-only; rejected by the API" }
        changed_only: { type: boolean }
        base_ref: { type: string }
        score_model: { type: string, enum: [v1, v2], description: "Risk score model (default v1); see docs/scoring.md" }
    ScanAccepted:
      type: object
      properties:
        success: { type: boolean }
        result_id: { type: string }
        status: { type: string, example: queued }
    ScanStatus:
      type: object
      properties:
        success: { type: boolean }
        status: { type: string }
        done: { type: boolean }
        result: { $ref: "#/components/schemas/ScanResult" }
    ScanSummary:
      type: object
      properties:
        id: { type: string }
        repo_url: { type: string }
        timestamp: { type: string }
        risk_score: { type: integer }
        total_matches: { type: integer }
        status: { type: string }
    RuleMatch:
      type: object
      properties:
        file_path: { type: string }
        line_number: { type: integer }
        matched_pattern: { type: string }
        severity: { type: string, description: "critical, high, medium or low; info for the scanner's own notices" }
        context: { type: string }
        rule_id: { type: string, description: "Id of the finding's rule, made from its name without the value the name carries", example: discord-webhook }
        description: { type: string, description: "The rule's description. Absent for a finding raised by code (chains, data flow, registry checks) and for a rule of a custom rules file" }
        attack:
          type: array
          description: ATT&CK techniques of the finding. Absent when it has none
          items:
            type: object
            properties:
              id: { type: string, example: T1567.004 }
              name: { type: string }
              tactic: { type: string }
        mbc:
          type: array
          description: MBC objectives of those techniques. Absent when there are none
          items: { type: string, example: OB0010 Exfiltration }
    ScanResult:
      type: object
      properties:
        id: { type: string }
        repo_url: { type: string }
        timestamp: { type: string }
        total_files: { type: integer }
        scanned_files: { type: integer }
        total_matches: { type: integer, description: "Findings listed: at most 20 of one rule in one file, then a notice with the count" }
        risk_score: { type: integer }
        ai_analysis: { type: object, nullable: true }
        rule_matches:
          type: array
          items: { $ref: "#/components/schemas/RuleMatch" }
        triage: { type: object, nullable: true }
        deobfuscation: { type: object, nullable: true }
        emulation: { type: object, nullable: true }
        ttp: { type: object, nullable: true }
        sandbox: { type: object, nullable: true }
        status: { type: string }
        duration_ms: { type: integer, nullable: true }
        score_breakdown:
          type: object
          nullable: true
          description: The parts risk_score is the sum of (capped at 100)
          properties:
            model: { type: string, enum: [v1, v2] }
            parts:
              type: array
              items:
                type: object
                properties:
                  name: { type: string }
                  points: { type: integer }
            known_vulnerabilities: { type: integer, description: "v2 only: counted apart from the score" }
        warnings:
          type: array
          description: "Requested passes that failed or were cut short, one line each (OSV lookup, AI analysis, AI agent text over the prompt budget, registry metadata). Absent when there are none: an absent AI verdict or no advisory finding then means the pass ran"
          items: { type: string, example: "OSV lookup failed: operation timed out; advisories and malicious-package records were not checked for 12 of 12 packages" }
        iocs:
          type: array
          description: External URLs / public IPs referenced by the scanned code, and hosts it contacted in the sandbox
          items:
            type: object
            properties:
              kind: { type: string, enum: [url, ip, sandbox-host] }
              value: { type: string }
              host: { type: string }
              files: { type: array, items: { type: string } }
