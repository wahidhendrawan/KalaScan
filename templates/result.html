<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loading result — KalaScan</title>
    <meta http-equiv="refresh" content="0; url=/?result={{ result_id | urlencode }}" />
    <script>
        // Fallback in case meta refresh is disabled.
        window.location.replace('/?result=' + encodeURIComponent('{{ result_id | urlencode }}'));
    </script>
    <style>
        body { margin: 0; height: 100vh; display: grid; place-items: center;
            background: #07080c; color: #94a3b8;
            font-family: ui-sans-serif, system-ui, sans-serif; }
        .box { text-align: center; }
        .spinner { width: 26px; height: 26px; margin: 0 auto 14px; border-radius: 9999px;
            border: 2px solid rgba(139,92,246,.22); border-top-color: #a78bfa;
            animation: spin .7s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        a { color: #a78bfa; font-size: 12px; }
    </style>
</head>
<body>
    <div class="box">
        <div class="spinner"></div>
        <div>Loading result…</div>
        <p><a href="/?result={{ result_id | urlencode }}">Continue manually</a></p>
    </div>
</body>
</html>
