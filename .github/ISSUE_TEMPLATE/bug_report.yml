name: Bug report
description: Report a crash, wrong output or broken command
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Do not paste credentials, private indicators or live malware here; for vulnerabilities use the private process in SECURITY.md. For a rule that fires on benign code, use the "False positive" template instead.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: The observed behaviour and its impact.
      placeholder: kalascan scan ... exits with ... / prints ...
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The exact command line (flags included) and a public target, if possible.
      placeholder: |
        1. kalascan scan npm:example@1.2.3 --format sarif
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - CLI scan
        - kalascan deps / diff / installed / sbom / import / rules
        - Web UI or JSON API
        - Docker image or Compose
        - GitHub Action
        - Deep passes (triage, deobfuscate, emulate, sandbox)
        - Export format (json, sarif, md, html, csv, junit, github)
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Output of `kalascan --version`, how it was installed, OS and architecture.
      placeholder: |
        kalascan --version:
        Installed via (install.sh / brew / cargo / docker / action):
        OS / arch:
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I removed credentials, private indicators and live malware from this report.
          required: true
