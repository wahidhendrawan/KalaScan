name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # upload-rust-binary-action only uploads assets; a release must exist first.
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate tag against Cargo.toml and CHANGELOG
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          cargo_version="$(python3 -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('Cargo.toml').read_text())['package']['version'])")"
          if [ "$version" != "$cargo_version" ]; then
            echo "::error::Tag version '$version' does not match Cargo.toml version '$cargo_version'."
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' section."
            exit 1
          fi
          echo "Validated release $GITHUB_REF_NAME (version $version)."

      - uses: taiki-e/create-gh-release-action@eba8ea96c86cca8a37f1b56e94b4d13301fba651 # v1
        with:
          # Release body = the matching CHANGELOG section (Keep a Changelog format).
          changelog: CHANGELOG.md
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    needs: create-release
    strategy:
      # One broken target must not cancel the other platforms' assets.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: universal-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Build and upload release binaries
        uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1
        with:
          bin: kalascan
          target: ${{ matrix.target }}
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}

  # SBOM of the source tree, keyless cosign signatures and SLSA provenance for
  # every archive the matrix uploaded. Verify an asset with:
  #   cosign verify-blob --bundle <asset>.sigstore.json \
  #     --certificate-identity-regexp '^https://github.com/wahidhendrawan/KalaScan/' \
  #     --certificate-oidc-issuer https://token.actions.githubusercontent.com <asset>
  #   gh attestation verify <asset> --repo wahidhendrawan/KalaScan
  sign-and-attest:
    needs: upload-assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the release archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$GITHUB_REF_NAME" --dir dist \
            --pattern 'kalascan-*.tar.gz' --pattern 'kalascan-*.zip'
          ls -l dist

      - name: Generate SBOM (CycloneDX) of the source tree
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/kalascan-${{ github.ref_name }}.sbom.cyclonedx.json
          upload-artifact: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign archives and SBOM (keyless)
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          for f in dist/*.tar.gz dist/*.zip dist/*.cyclonedx.json; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.cyclonedx.json

      - name: Upload SBOM and signatures to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.cyclonedx.json dist/*.sigstore.json --clobber
