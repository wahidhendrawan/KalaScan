name: Docker build
on:
  push:
    branches: [main]
    # A release tag publishes the image under its version. `paths` is not
    # applied to a tag push.
    tags: ['v*']
    paths:
      - 'src/**'
      - 'templates/**'
      - 'static/**'
      - 'Dockerfile'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'openapi.yaml'
      - '.github/workflows/docker.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # Docker repository names must be lowercase (the repo is KalaScan).
  IMAGE_NAME: ${{ github.repository_owner }}/kalascan

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each arch compiles natively; QEMU-emulated arm64 release
          # builds previously took hours and never finished.
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          # Run-unique tags so the merge job never mixes arches from
          # different overlapping runs (which left `:latest` stale).
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.arch }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  merge:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge multi-arch manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          # main is :latest, the tag v1.26.0 is :1.26.0; both keep the commit tag.
          name=latest
          if [ "$GITHUB_REF_TYPE" = tag ]; then name="${GITHUB_REF_NAME#v}"; fi
          docker buildx imagetools create \
            --tag "$IMAGE:$name" \
            --tag "$IMAGE:sha-${GITHUB_SHA::7}" \
            "$IMAGE:amd64-$GITHUB_SHA" \
            "$IMAGE:arm64-$GITHUB_SHA"

      - name: Make package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GITHUB_TOKEN cannot manage *user-owned* package visibility (the
          # packages REST API answers 404 for it). Flip it once by hand:
          # https://github.com/users/wahidhendrawan/packages/container/kalascan/settings
          # (visibility is sticky, so a single manual toggle is enough).
          gh api --method PATCH \
            "/users/${{ github.repository_owner }}/packages/container/kalascan" \
            -f visibility=public
