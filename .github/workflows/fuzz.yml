name: Fuzz
# Coverage-guided fuzzing of the parsers of untrusted input (fuzz/). Weekly
# and on demand: five minutes per target finds the shallow crashes; a crash
# fails the job and its input is kept as an artifact.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [import_report, lockfile, archive, rules, text_analyzers, binary, deobfuscate, strace]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      # Same dependency versions as the release build.
      - run: cp Cargo.lock fuzz/Cargo.lock
      - run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=300 -timeout=30 -rss_limit_mb=4096
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
